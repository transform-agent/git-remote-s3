[package]
name = "git-remote-s3"
version = "0.3.2"
edition = "2021"
description = "A git remote helper for Amazon S3"
license = "Apache-2.0"
repository = "https://github.com/awslabs/git-remote-s3"

[[bin]]
name = "git-remote-s3"
path = "src/bin/git_remote_s3.rs"

[[bin]]
name = "git-lfs-s3"
path = "src/bin/git_lfs_s3.rs"

[[bin]]
name = "git-s3"
path = "src/bin/git_s3.rs"

[lib]
name = "git_remote_s3"
path = "src/lib.rs"

[dependencies]
# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Serialisation (LFS JSON protocol)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Temporary files/directories
tempfile = "3"

# UUID generation (manage doctor)
uuid = { version = "1", features = ["v4"] }

# Date/time arithmetic (lock TTL)
chrono = { version = "0.4", features = ["clock"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "1"

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
